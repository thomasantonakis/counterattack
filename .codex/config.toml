
[mcp_servers.unity]
# Resolve the local CLI through PATH and the project from Codex's working directory.
# Open Codex in this checkout. Shell-based Editor control still passes --project-path.
command = "unity"
args = ["mcp"]

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true
allow_local_binding = false

[features.network_proxy.domains]
localhost = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"
