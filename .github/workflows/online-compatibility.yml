name: Online compatibility

on:
  pull_request:
    branches: [codex/online-foundation-personal-mac]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  online-compatibility:
    name: Online compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify compatibility declaration
        run: python3 Tools/online_compatibility.py check "$GITHUB_EVENT_PATH"
