name: Release version

on:
  pull_request:
    branches: [master, codex/online-foundation-personal-mac]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-version-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && !contains(github.event.pull_request.title, '[skip version]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Tag the next branch version
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          if [[ "${BASE_BRANCH}" == "master" ]]; then
            prefix="v0.11."
            initial="0.11.0"
          else
            prefix="v0.10."
            initial="0.10.20"
          fi
          git fetch --force origin "+refs/tags/${prefix}*:refs/tags/${prefix}*" || true
          latest=$(git tag --list "${prefix}*" --sort=-version:refname | head -n 1)
          if [[ -z "${latest}" ]]; then
            version="${initial}"
          else
            patch=${latest##*.}
            patch=$((patch + 1))
            version="${prefix#v}${patch}"
          fi
          tag="v${version}"
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"
          echo "Tagged merge as ${tag}; Unity bundleVersion updates still require a PR."
